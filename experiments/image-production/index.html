<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image → Japanese · Local preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:880px;margin:40px auto;padding:0 20px}header{margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#777}h1{font-size:26px;font-weight:600;margin:10px 0}header p{color:#686868;font-size:14px;line-height:1.6}.toolbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;margin:20px 0}select,button{font:inherit;border:1px solid #d6d5d0;border-radius:8px;background:white;color:inherit;padding:10px 14px}label{display:flex;align-items:center;gap:8px}input[type=range]{width:110px;accent-color:#466457}.stage{max-width:600px;margin:auto;background:white;border:1px solid #e6e5df;border-radius:16px;overflow:hidden;box-shadow:0 10px 35px #00000005}.card{height:480px;position:relative;text-align:center;--duration:440ms;cursor:pointer}.picture{position:absolute;inset:40px 20px auto;height:320px;display:flex;align-items:center;justify-content:center;transform-origin:center top;transition:transform var(--duration) cubic-bezier(.22,1,.36,1)}.picture img{width:100%;height:100%;object-fit:contain}.card.revealed .picture{transform:translateY(-20px) scale(.72)}.answer{position:absolute;top:278px;left:16px;right:16px;opacity:0;transform:translateY(16px);visibility:hidden;transition:opacity calc(var(--duration)*.7) ease,transform var(--duration) cubic-bezier(.22,1,.36,1),visibility 0s var(--duration)}.revealed .answer{visibility:visible;opacity:1;transform:none;transition-delay:calc(var(--duration)*.18)}.reading{font-size:19px;color:#d63964;margin-bottom:2px}.word{font-size:44px;font-weight:700;line-height:1.4}.sound{margin-top:14px;font-size:13px;border:0;background:#f4f4f2;color:#626262}.actions{border-top:1px solid #eeede8;padding:16px;display:flex;gap:10px;justify-content:center}.primary{background:#365748;color:white;border-color:#365748;min-width:142px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid #73a591;outline-offset:3px}.footer{text-align:center;color:#777;font-size:12px;line-height:1.8;margin:15px}.dark{background:#181a19;color:#eee}.dark .stage,.dark select,.dark button:not(.primary){background:#242625;border-color:#414440}.dark .actions{border-color:#414440}.dark header p,.dark .footer{color:#aaa}.dark .sound{color:#ddd}.narrow .stage{max-width:375px}@media(max-width:500px){main{margin:22px auto;padding:0 12px}.card{height:430px}.picture{inset:24px 12px auto;height:280px}.answer{top:240px}.toolbar{gap:12px}.actions{padding:12px;gap:6px}.actions button{padding:10px}.primary{min-width:120px}}@media(prefers-reduced-motion:reduce){.picture,.answer{transition:none!important}}

.stage{container-type:inline-size}
.card{--banner-width:min(480px,calc(100cqw - 40px));--banner-height:calc(var(--banner-width)/3);transition:height var(--duration) cubic-bezier(.22,1,.36,1)}
.picture{transition:height var(--duration) cubic-bezier(.22,1,.36,1),top var(--duration) cubic-bezier(.22,1,.36,1);transform:none!important}
.picture img{transition:padding var(--duration) cubic-bezier(.22,1,.36,1);max-width:480px}
.card.revealed .picture{top:0;height:var(--banner-height)}
.card.revealed .picture img{padding:4cqw 6cqw}
.card.revealed{height:calc(var(--banner-height) + var(--answer-height,900px));cursor:default}
.answer{top:var(--banner-height);left:0;right:0;line-height:0}.answer iframe{display:block;width:100%;border:0;background:transparent}
.actions{position:sticky;bottom:0;background:white;z-index:2}.dark .actions{background:#242625}
.narrow .card{--banner-width:min(480px,calc(100cqw - 24px))}
.narrow .picture{inset:24px 12px auto;height:280px}
.narrow .card.revealed .picture{top:0;height:var(--banner-height)}
@media(max-width:500px){.card{--banner-width:min(480px,calc(100cqw - 24px))}.answer{top:var(--banner-height)}}
@media(prefers-reduced-motion:reduce){.card,.picture,.picture img{transition:none!important}}
</style></head><body><main>
<header><div class="eyebrow">Anki · Local motion study</div><h1>Image → Japanese</h1><p>Say the word, then reveal the answer. Reveal the full answer: word audio, both example sentences, and interactive kanji breakdowns.</p></header>
<div class="toolbar"><label>Sample <select id="sample" aria-label="Sample"></select></label><label>Reveal <input id="speed" type="range" min="150" max="1000" step="10" value="440"><output id="speedLabel">440 ms</output></label><label><input id="night" type="checkbox">Dark</label><label><input id="narrow" type="checkbox">Phone width</label><span>Word audio plays on reveal</span></div>
<section class="stage" aria-label="Image production preview"><div id="card" class="card" tabindex="0" role="button" aria-label="Reveal Japanese answer"><div class="picture"><img id="picture" alt="Identify the pictured object in Japanese"></div><div class="answer" id="answer" aria-hidden="true"><iframe id="details" title="Japanese answer, example sentences and kanji breakdown" tabindex="-1"></iframe></div></div><div class="actions"><button class="primary" id="flip">Show answer</button><button id="replay" disabled>Replay reveal</button><button id="next">Next →</button></div></section>
<p class="footer">Space: reveal / reset · →: next sample<br>Local preview only · No deck changes</p><audio id="audio" preload="auto"></audio><script src="samples.js"></script><script>
const $=id=>document.getElementById(id);let index=0,revealed=false,replayTimer;const card=$('card');samples.forEach((s,i)=>$('sample').add(new Option('Object '+(i+1),i)));samples.forEach(s=>{const image=new Image();image.src=s.image});
function setReveal(value){clearTimeout(replayTimer);revealed=value;card.classList.toggle('revealed',value);$('answer').setAttribute('aria-hidden',!value);$('details').tabIndex=value?0:-1;$('details').inert=!value;$('flip').textContent=value?'Show question':'Show answer';card.setAttribute('aria-label',value?'Japanese answer shown':'Reveal Japanese answer');$('replay').disabled=!value;if(value)play();if(!value){$('audio').pause();$('details').contentDocument?.querySelectorAll('audio').forEach(a=>a.pause())}}
function play(){const a=$('audio');a.currentTime=0;a.play().catch(()=>{console.warn('Audio could not play')})}
let answerObserver;
function syncTheme(){const body=$('details').contentDocument?.body;if(body)body.classList.toggle('nightMode',document.body.classList.contains('dark'))}
function sizeAnswer(){const body=$('details').contentDocument?.body;if(!body)return;const height=Math.ceil(body.getBoundingClientRect().height);$('details').style.height=height+'px';card.style.setProperty('--answer-height',height+'px')}
$('details').onload=()=>{answerObserver?.disconnect();syncTheme();const body=$('details').contentDocument.body;answerObserver=new ResizeObserver(sizeAnswer);answerObserver.observe(body);sizeAnswer()};
function load(){setReveal(false);const s=samples[index];$('picture').src=s.image;$('audio').src=s.audio;$('details').srcdoc=s.doc;$('sample').value=index}
$('flip').onclick=()=>setReveal(!revealed);card.onclick=()=>{if(!revealed)setReveal(true)};card.onkeydown=e=>{if(e.target===card&&e.key==='Enter'){e.preventDefault();if(!revealed)setReveal(true)}};$('replay').onclick=()=>{setReveal(false);replayTimer=setTimeout(()=>setReveal(true),Number($('speed').value)+100)};$('next').onclick=()=>{index=(index+1)%samples.length;load()};$('sample').onchange=()=>{index=Number($('sample').value);load()};$('speed').oninput=()=>{card.style.setProperty('--duration',$('speed').value+'ms');$('speedLabel').textContent=$('speed').value+' ms'};$('night').onchange=e=>{document.body.classList.toggle('dark',e.target.checked);syncTheme()};$('narrow').onchange=e=>document.body.classList.toggle('narrow',e.target.checked);document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();setReveal(!revealed)}if(e.key==='ArrowRight')$('next').click()});load();
</script></main></body></html>
